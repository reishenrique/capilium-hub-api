services:
  redis:  
    container_name: 'redis'
    image: bitnami/redis:latest
    environment:
      - REDIS_PASSWORD=23b745f3d9ef77236e3e
      - REDIS_PORT=6379
    command: /opt/bitnami/scripts/redis/run.sh
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis:/data
volumes:
  redis:
    driver: local
      